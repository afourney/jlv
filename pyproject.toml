[project]
name = "jlv"
version = "0.0.1"
description = "A terminal viewer for JSONL files"
readme = "README.md"
authors = [
    { name = "Adam Fourney", email = "adam.fourney@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["textual>=8.0.0"]

[project.scripts]
jlv = "jlv:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
