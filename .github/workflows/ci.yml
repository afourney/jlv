name: check

# Every push to a PR and to main runs the complete, bounded suite.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          version: "0.12.23"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run --no-sync poe check
        timeout-minutes: 2

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --frozen
      # Textual pilot tests dominate; the full suite takes about five minutes locally.
      - run: uv run --no-sync poe test -ra --durations=10
        timeout-minutes: 12

  portable:
    name: portable (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync poe test -ra --durations=10
        timeout-minutes: 12

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --no-sync poe build-check
        timeout-minutes: 2
